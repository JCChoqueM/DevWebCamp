<VirtualHost *:80>
    ServerAdmin admin@localhost
    DocumentRoot /var/www/html/public

    Header set Content-Security-Policy "default-src 'self' http://localhost:5174 ws://localhost:5174; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://localhost:5174 ws://localhost:5174 https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' http://localhost:5174 https://fonts.googleapis.com https://unpkg.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: http://localhost:5174 https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self' ws://localhost:5174 http://localhost:5174 https://unpkg.com;"

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        AcceptPathInfo On
    </Directory>

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/build/
        RewriteRule ^(.*)$ index.php/$1 [L,QSA]
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>