services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: devwebcamp_php
    ports:
      - "8083:80"
      - "5174:5174"  # ← puerto para Vite
    volumes:
      - .:/var/www/html
      - ./docker/apache.conf:/etc/apache2/sites-available/000-default.conf
    working_dir: /var/www/html
    command: >
      bash -c "
        if [ ! -d 'vendor' ]; then
          echo '>>> Instalando dependencias de Composer...' &&
          composer install --no-interaction --prefer-dist
        else
          echo '>>> vendor/ ya existe, saltando Composer'
        fi &&

        if [ ! -d 'node_modules' ]; then
          echo '>>> Instalando dependencias de NPM...' &&
          npm install
        else
          echo '>>> node_modules/ ya existe, saltando NPM'
        fi &&

        echo '>>> Todo listo. Iniciando Apache...' &&
        apache2-foreground
      "
    depends_on:
      - mysql
    networks:
      - devwebcamp_network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: devwebcamp_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: devwebcamp
    volumes:
      - devwebcamp_mysql_data:/var/lib/mysql
      - .:/docker-entrypoint-initdb.d/host
    ports:
      - "3309:3306"
    networks:
      - devwebcamp_network
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password

volumes:
  devwebcamp_mysql_data:

networks:
  devwebcamp_network:
    driver: bridge
